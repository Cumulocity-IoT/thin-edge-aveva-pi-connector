name: Build and Upload ZIP Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.0.4) — leave blank to use the pushed tag"
        required: false

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 0: Resolve version once; all other jobs consume it
  # ─────────────────────────────────────────────────────────
  get-version:
    name: "Resolve Release Version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Extract version
        id: vars
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            RAW="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RAW="${GITHUB_REF#refs/tags/}"
          else
            echo "ERROR: 'version' input is empty and ref is not a tag ($GITHUB_REF). Provide a version like v0.0.4 or run this workflow from a tag." >&2
            exit 1
          fi
          echo "version=${RAW#v}" >> $GITHUB_OUTPUT
          echo "tag=$RAW" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────
  # Job 1: Standard (online) release — source + compose only
  # ─────────────────────────────────────────────────────────
  build-standard:
    name: "Standard Release (online install)"
    runs-on: ubuntu-latest
    needs: get-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build standard ZIP
        id: zip
        run: |
          ZIP_NAME="pi_historian_connector_${{ needs.get-version.outputs.version }}_online.zip"
          zip "$ZIP_NAME" \
            app.py \
            docker-compose.yaml \
            Dockerfile \
            logging.conf \
            requirements.txt
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Upload standard artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: standard-release
          path: ${{ steps.zip.outputs.zip_name }}

  # ─────────────────────────────────────────────────────────
  # Job 2: Air-gap release — Docker image + wheels bundled
  # ─────────────────────────────────────────────────────────
  build-offline:
    name: "Offline Release"
    runs-on: ubuntu-latest
    needs: get-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Build offline ZIP via build_release.sh
        run: |
          chmod +x scripts/build_release.sh
          scripts/build_release.sh ${{ needs.get-version.outputs.version }}

      - name: Upload offline artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: offline-release
          path: pi_historian_connector_v${{ needs.get-version.outputs.version }}_offline.zip

  # ─────────────────────────────────────────────────────────
  # Job 3: Build pi-historian-flow tarball (Node.js / tedge-flow)
  # ─────────────────────────────────────────────────────────
  build-pi-historian-flow:
    name: "Build PI Historian Flow (tedge-flow)"
    runs-on: ubuntu-latest
    needs: get-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build tarball
        working-directory: pi-historian-flow
        run: |
          npm ci
          npm run package

      - name: Rename tarball to include version
        run: |
          mv pi-historian-flow.tar.gz \
             pi-historian-flow_${{ needs.get-version.outputs.version }}.tar.gz

      - name: Upload flow artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pi-historian-flow-release
          path: pi-historian-flow_${{ needs.get-version.outputs.version }}.tar.gz

  # ─────────────────────────────────────────────────────────
  # Job 4: Publish all artifacts to GitHub Release
  # ─────────────────────────────────────────────────────────
  publish-release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [get-version, build-standard, build-offline, build-pi-historian-flow]

    steps:
      - name: Download standard artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: standard-release

      - name: Download offline artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: offline-release

      - name: Download pi-historian-flow artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: pi-historian-flow-release

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: "PI Historian Connector ${{ needs.get-version.outputs.tag }}"
          body: |
            ## PI Historian Connector ${{ needs.get-version.outputs.tag }}

            ### Assets
            | File | Description |
            |---|---|
            | `*_online.zip` | Standard release — requires internet on the target device to pull the Docker image |
            | `*_offline.zip` | Offline release — includes pre-built Docker image tarball and pip wheels for fully offline deployment |
            | `pi-historian-flow_*.tar.gz` | thin-edge.io tedge-flow package — drop-in flow for polling AVEVA PI Web API and publishing measurements to Cumulocity |

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for installation instructions.
          files: |
            *_online.zip
            *_offline.zip
            pi-historian-flow_*.tar.gz
